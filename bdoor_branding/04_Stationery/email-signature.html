<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bdoor email signature</title>
  </head>
  <body style="margin: 0; background: #fff; font-family: Arial, sans-serif; color: #081633">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      style="border-collapse: collapse; max-width: 560px"
    >
      <tr>
        <td style="padding-right: 18px; border-right: 2px solid #164eeb; vertical-align: middle">
          <img
            src="https://bdoor.io/brand/bdoor-symbol.png"
            width="64"
            height="64"
            alt="bdoor"
            style="display: block; border: 0"
          />
        </td>
        <td style="padding-left: 18px; vertical-align: middle">
          <div style="font-size: 17px; font-weight: 700; line-height: 1.35">[Full name]</div>
          <div style="font-size: 13px; color: #667085; line-height: 1.5">[Job title] | bdoor</div>
          <div style="font-size: 13px; line-height: 1.6">
            <a href="mailto:name@bdoor.io" style="color: #164eeb; text-decoration: none"
              >name@bdoor.io</a
            >
            &nbsp;|&nbsp;
            <a href="https://bdoor.io" style="color: #164eeb; text-decoration: none">bdoor.io</a>
          </div>
          <div style="font-size: 11px; color: #667085; line-height: 1.45; margin-top: 5px">
            Your door to business in Bangladesh.
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
