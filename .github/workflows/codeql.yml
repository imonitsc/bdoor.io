name: CodeQL

on:
  pull_request:
  push:
    branches: [claude/new-session-0n73z6, main]
  schedule:
    # Weekly, so a newly published rule finds existing code without waiting
    # for someone to open a pull request.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
